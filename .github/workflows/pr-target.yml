name: PR target

on:
  pull_request:
    branches: [main]

jobs:
  pr-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only develop (or a hotfix branch) may be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # develop carries every release; a hotfix/* branch carries a patch cut from main (it must not drag unreleased work)
          case "$HEAD_REF" in
            develop|hotfix/*) ;;
            *)
              echo "::error::Pull requests into main must come from develop, or from a hotfix/* branch for a patch. Open yours against develop instead."
              exit 1
              ;;
          esac
