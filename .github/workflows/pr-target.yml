name: PR target

on:
  pull_request:
    branches: [main]

jobs:
  pr-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only develop may be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop. Open yours against develop instead."
            exit 1
          fi
