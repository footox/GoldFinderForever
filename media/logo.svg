<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3a2a14"/>
      <stop offset="1" stop-color="#120c06"/>
    </radialGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#9a6a12"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#7a4f0a"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e8f6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fb6d8" stop-opacity="0.18"/>
    </radialGradient>
  </defs>
  <!-- fondo con marco dorado -->
  <rect x="0" y="0" width="400" height="400" rx="56" fill="url(#bg)"/>
  <rect x="10" y="10" width="380" height="380" rx="48" fill="none" stroke="#c9952e" stroke-width="6"/>
  <!-- moneda -->
  <circle cx="180" cy="178" r="118" fill="url(#rim)"/>
  <circle cx="180" cy="178" r="104" fill="url(#coin)"/>
  <circle cx="180" cy="178" r="88" fill="none" stroke="#a8761a" stroke-width="4" stroke-dasharray="6 7"/>
  <text x="166" y="204" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="84"
        font-weight="bold" fill="#6b4507" stroke="#fff0b0" stroke-width="2">GF</text>
  <!-- lupa -->
  <line x1="296" y1="296" x2="360" y2="360" stroke="#3b2410" stroke-width="30" stroke-linecap="round"/>
  <line x1="296" y1="296" x2="360" y2="360" stroke="#8a5a26" stroke-width="20" stroke-linecap="round"/>
  <circle cx="272" cy="272" r="52" fill="url(#glass)" stroke="#d9a83c" stroke-width="12"/>
  <circle cx="272" cy="272" r="52" fill="none" stroke="#7a4f0a" stroke-width="3"/>
  <path d="M244 252 a34 34 0 0 1 26 -19" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="7"
        stroke-linecap="round"/>
</svg>
