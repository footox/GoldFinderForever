<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1e3550"/>
      <stop offset="1" stop-color="#0a1320"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3b4655"/>
      <stop offset="1" stop-color="#11161d"/>
    </radialGradient>
    <radialGradient id="belly" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e2ec"/>
    </radialGradient>
    <radialGradient id="coin" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fff4b0"/>
      <stop offset="0.45" stop-color="#f4c446"/>
      <stop offset="1" stop-color="#9a6a12"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#7a4f0a"/>
    </linearGradient>
    <symbol id="c" viewBox="-30 -30 60 60">
      <ellipse cx="0" cy="0" rx="28" ry="10" fill="#7a4f0a"/>
      <ellipse cx="0" cy="-4" rx="28" ry="10" fill="url(#coin)" stroke="#9a6a12" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- fondo con marco dorado -->
  <rect x="0" y="0" width="400" height="400" rx="56" fill="url(#bg)"/>
  <rect x="10" y="10" width="380" height="380" rx="48" fill="none" stroke="#c9952e" stroke-width="6"/>

  <!-- montón de monedas -->
  <use href="#c" x="38" y="300" width="80" height="80"/>
  <use href="#c" x="78" y="312" width="80" height="80"/>
  <use href="#c" x="242" y="312" width="80" height="80"/>
  <use href="#c" x="282" y="300" width="80" height="80"/>
  <use href="#c" x="60" y="285" width="80" height="80"/>
  <use href="#c" x="262" y="285" width="80" height="80"/>

  <!-- pies -->
  <ellipse cx="168" cy="340" rx="30" ry="12" fill="#f39a1e" stroke="#9a5408" stroke-width="4"/>
  <ellipse cx="232" cy="340" rx="30" ry="12" fill="#f39a1e" stroke="#9a5408" stroke-width="4"/>

  <!-- cuerpo -->
  <ellipse cx="200" cy="215" rx="104" ry="128" fill="url(#body)" stroke="#05080c" stroke-width="5"/>
  <!-- panza blanca -->
  <ellipse cx="200" cy="240" rx="70" ry="96" fill="url(#belly)"/>
  <!-- cara blanca -->
  <path d="M138 150 Q150 104 200 108 Q250 104 262 150 Q262 186 200 196 Q138 186 138 150 Z" fill="url(#belly)"/>

  <!-- ojos -->
  <ellipse cx="174" cy="146" rx="15" ry="18" fill="#ffffff" stroke="#05080c" stroke-width="3"/>
  <ellipse cx="226" cy="146" rx="15" ry="18" fill="#ffffff" stroke="#05080c" stroke-width="3"/>
  <circle cx="178" cy="150" r="8" fill="#0a0f16"/>
  <circle cx="222" cy="150" r="8" fill="#0a0f16"/>
  <circle cx="181" cy="146" r="3" fill="#ffffff"/>
  <circle cx="225" cy="146" r="3" fill="#ffffff"/>
  <!-- mejillas -->
  <ellipse cx="156" cy="174" rx="11" ry="6" fill="#ff9aa8" opacity="0.6"/>
  <ellipse cx="244" cy="174" rx="11" ry="6" fill="#ff9aa8" opacity="0.6"/>

  <!-- pico -->
  <path d="M178 166 Q200 158 222 166 Q212 190 200 192 Q188 190 178 166 Z" fill="#f7a62a" stroke="#9a5408"
        stroke-width="4" stroke-linejoin="round"/>
  <path d="M182 170 Q200 178 218 170" fill="none" stroke="#9a5408" stroke-width="3" stroke-linecap="round"/>

  <!-- moneda grande abrazada -->
  <circle cx="200" cy="262" r="62" fill="url(#rim)" stroke="#5a3a08" stroke-width="4"/>
  <circle cx="200" cy="262" r="50" fill="url(#coin)"/>
  <circle cx="200" cy="262" r="41" fill="none" stroke="#a8761a" stroke-width="3" stroke-dasharray="5 6"/>
  <text x="200" y="284" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58"
        font-weight="bold" fill="#6b4507" stroke="#fff0b0" stroke-width="1.5">G</text>
  <path d="M174 236 a32 32 0 0 1 20 -12" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6"
        stroke-linecap="round"/>

  <!-- aletas sosteniendo la moneda -->
  <path d="M108 190 Q84 250 128 296 Q150 300 154 280 Q130 252 132 206 Z" fill="url(#body)" stroke="#05080c"
        stroke-width="4" stroke-linejoin="round"/>
  <path d="M292 190 Q316 250 272 296 Q250 300 246 280 Q270 252 268 206 Z" fill="url(#body)" stroke="#05080c"
        stroke-width="4" stroke-linejoin="round"/>

  <!-- destellos -->
  <path d="M86 96 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 Z" fill="#ffe27a"/>
  <path d="M318 76 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#ffe27a"/>
</svg>
